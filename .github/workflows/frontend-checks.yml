name: Frontend Checks

on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit
        
      - name: Build
        working-directory: ./frontend
        run: npm run build
